name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Publish release with the exe
        run: >
          gh release create ${{ github.ref_name }}
          target/release/ironpad.exe
          --generate-notes
          --title "ironpad ${{ github.ref_name }}" ||
          gh release upload ${{ github.ref_name }} target/release/ironpad.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
